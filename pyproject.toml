[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hew_measures"
version = "0.1.0"
description = "HEW Measures Rollup"
authors = [
    { name = "Mike Conway", email = "mike.conway@nih.gov" },
]
requires-python = ">=3.11"
license = { text = "BSD 3-Clause" }
dependencies = [
    "urllib3~=2.8.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/NIEHS/accelerator-dataverse-hew"

[project.optional-dependencies]
dev = [
    "pre-commit~=4.1.0",
    "black~=25.1.0",
    "pytest~=8.3.5",
    "coverage~=7.6.12",
]

[tool.setuptools.packages.find]
include = ["accelerator_dataverse_hew*"]
